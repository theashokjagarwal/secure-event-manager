<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EventSecure</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <span>🛡️ EventSecure</span>
      </a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/register" class="btn btn-secondary btn-sm">Register</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-header">
        <h1>Sign In</h1>
        <p>Enter your credentials to access your account</p>
      </div>

      <!-- Friendly Notification / Error Banner -->
      <div id="auth-alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input
            type="email"
            id="login-email"
            class="form-input"
            placeholder="e.g. user@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            class="form-input"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%;">
          Sign In
        </button>
      </form>

      <!-- Quick Demo Credentials Box for Evaluation -->
      <div style="margin-top: 1.5rem; background: #f8fafc; border: 1px dashed #cbd5e1; padding: 0.85rem; border-radius: 8px; font-size: 0.82rem; color: #475569;">
        <strong>Quick Demo Credentials:</strong><br>
        • Admin: <code>admin@example.com</code> / <code>Admin@12345</code><br>
        • User: <code>user@example.com</code> / <code>User@12345</code>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Create an account</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>EventSecure &copy; 2026. Rate-limited and protected with BCrypt & JWT.</p>
  </footer>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
